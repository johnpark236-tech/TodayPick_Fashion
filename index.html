<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodayPick — 오늘 뭐 입지? AI 라이프스타일 추천</title>
    <meta name="description" content="오늘 뭐 입지? TodayPick이 골라드릴게요. 계절과 연령, 스타일에 맞는 오늘의 코디를 쉽고 빠르게 만나보세요." />
    <meta property="og:title" content="TodayPick — 오늘 뭐 입지? AI 라이프스타일 추천" />
    <meta property="og:description" content="오늘 뭐 입지? TodayPick이 골라드릴게요. 계절과 연령, 스타일에 맞는 오늘의 코디를 쉽고 빠르게 만나보세요." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
      #todaypick-demo-visitor-counter {
        width: min(1180px, calc(100% - 28px));
        margin: 14px auto 0;
        padding: 18px 22px;
        border: 1px solid rgba(139, 92, 246, 0.16);
        border-radius: 24px;
        background:
          radial-gradient(circle at 12% 20%, rgba(167, 139, 250, 0.18), transparent 34%),
          radial-gradient(circle at 88% 15%, rgba(56, 189, 248, 0.14), transparent 36%),
          linear-gradient(135deg, rgba(255,255,255,.96), rgba(248,247,255,.96));
        box-shadow: 0 16px 48px rgba(76, 29, 149, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .tp-demo-counter-copy {
        min-width: 0;
      }

      .tp-demo-counter-kicker {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .02em;
        color: #6d28d9;
      }

      .tp-demo-counter-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #22c55e;
        box-shadow: 0 0 0 6px rgba(34,197,94,.10);
        animation: tpLivePulse 1.8s ease-in-out infinite;
      }

      .tp-demo-counter-title {
        margin: 0;
        font-size: clamp(18px, 2vw, 28px);
        line-height: 1.2;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #111827;
      }

      .tp-demo-counter-note {
        margin-top: 6px;
        font-size: 11px;
        color: #94a3b8;
      }

      .tp-demo-counter-number-wrap {
        text-align: right;
        flex: 0 0 auto;
      }

      #tp-demo-counter-number {
        display: block;
        min-width: 168px;
        font-size: clamp(36px, 5vw, 64px);
        line-height: .95;
        font-weight: 950;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
        background: linear-gradient(90deg, #7c3aed, #4f46e5 52%, #0284c7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transition: transform .28s ease, filter .28s ease;
      }

      #tp-demo-counter-number.tp-bump {
        transform: translateY(-2px) scale(1.035);
        filter: drop-shadow(0 8px 18px rgba(124,58,237,.18));
      }

      .tp-demo-counter-unit {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        font-weight: 800;
        color: #64748b;
      }

      @keyframes tpLivePulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.35); opacity: .55; }
      }

      @media (max-width: 680px) {
        #todaypick-demo-visitor-counter {
          margin-top: 10px;
          padding: 16px;
          border-radius: 20px;
          align-items: flex-end;
        }
        .tp-demo-counter-title {
          font-size: 17px;
        }
        #tp-demo-counter-number {
          min-width: 114px;
          font-size: 38px;
        }
        .tp-demo-counter-note {
          max-width: 210px;
          line-height: 1.35;
        }
      }
    </style>
  </head>
  <body class="bg-[#F8F7FC] text-slate-800 antialiased selection:bg-purple-100 selection:text-purple-900">
    <section id="todaypick-demo-visitor-counter" aria-label="TodayPick 방문자 데모 카운터">
      <div class="tp-demo-counter-copy">
        <div class="tp-demo-counter-kicker">
          <span class="tp-demo-counter-dot" aria-hidden="true"></span>
          TODAYPICK LIVE · DEMO
        </div>
        <h2 class="tp-demo-counter-title">누적 방문자</h2>
        <div class="tp-demo-counter-note">화면 연출용 데모 카운터 · 실제 분석값은 Vercel Analytics 연결 후 교체 가능합니다.</div>
      </div>
      <div class="tp-demo-counter-number-wrap">
        <strong id="tp-demo-counter-number" aria-live="polite">12,480</strong>
        <span class="tp-demo-counter-unit">VISITS</span>
      </div>
    </section>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const storageKey = 'todaypick-demo-visitor-count-v1';
        const numberEl = document.getElementById('tp-demo-counter-number');
        if (!numberEl) return;

        const initialBase = 12480;
        const stored = Number.parseInt(localStorage.getItem(storageKey) || '', 10);
        let count = Number.isFinite(stored) && stored >= initialBase ? stored : initialBase;

        const render = () => {
          numberEl.textContent = count.toLocaleString('ko-KR');
        };

        const bump = () => {
          const increment = 1 + Math.floor(Math.random() * 4);
          count += increment;
          localStorage.setItem(storageKey, String(count));
          render();
          numberEl.classList.remove('tp-bump');
          requestAnimationFrame(() => {
            numberEl.classList.add('tp-bump');
            window.setTimeout(() => numberEl.classList.remove('tp-bump'), 320);
          });

          const nextDelay = 3200 + Math.floor(Math.random() * 5200);
          window.setTimeout(bump, nextDelay);
        };

        render();
        window.setTimeout(bump, 1800 + Math.floor(Math.random() * 2200));
      })();
    </script>
  </body>
</html>
